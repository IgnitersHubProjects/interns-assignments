<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palindrome Checker</title>
</head>
<body>
    <h1>Palindrome Checker</h1>
    <input type="text" id="inputString" placeholder="Enter a string">
    <button onclick="checkPalindrome()">Check</button>
    <p id="result"></p>

    <script>
        function checkPalindrome() {
            let input = document.getElementById('inputString').value;
            let result = isPalindrome(input);
            let outputMessage = result ? 
                `The string '${input}' is a palindrome.` : 
                `The string '${input}' is not a palindrome.`;
            document.getElementById('result').innerText = outputMessage;
        }

        function isPalindrome(str) {
            return str === str.split('').reverse().join('');
        }
    </script>
</body>
</html>
